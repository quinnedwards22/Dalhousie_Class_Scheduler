name: Refresh timetable data

on:
  schedule:
    # 06:00 and 18:00 UTC, matching the cron the FastAPI service used to run.
    - cron: '0 6,18 * * *'
  workflow_dispatch:

# A refresh deletes a term's rows before reinserting them, so two overlapping
# runs could interleave and leave a term half-populated. Queue instead of
# cancelling: never kill a run that may be mid-upload.
concurrency:
  group: refresh-timetable
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full scrape takes ~8.5 minutes; this is headroom, not a target.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scheduler/requirements.txt

      - name: Install dependencies
        run: pip install -r scheduler/requirements.txt

      - name: Scrape and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scheduler.run_once
