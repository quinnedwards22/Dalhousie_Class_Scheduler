name: Refresh timetable data

on:
  schedule:
    # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC).
    - cron: '0 */6 * * *'
  workflow_dispatch:

# A refresh deletes a term's rows before reinserting them, so two overlapping
# runs could interleave and leave a term half-populated. Queue instead of
# cancelling: never kill a run that may be mid-upload.
concurrency:
  group: refresh-timetable
  cancel-in-progress: false

permissions:
  contents: read
  # Needed by the keepalive step below to re-enable this workflow.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full scrape takes ~8.5 minutes; this is headroom, not a target.
    timeout-minutes: 30

    steps:
      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which silently stops the refresh. Re-enabling the workflow
      # through the API on every run keeps the schedule alive. It runs first
      # and regardless of the outcome of the rest of the job.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-timetable.yml/enable"

      - name: Check secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scheduler/requirements.txt

      - name: Install dependencies
        run: pip install -r scheduler/requirements.txt

      - name: Scrape and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scheduler.run_once
